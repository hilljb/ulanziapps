# Copy this file to secrets.toml and fill in the values. secrets.toml is gitignored.
# Paths are relative to firestore_nightscout/.

[gcp]
# GCP project that holds the xdrip2gcp Firestore database.
project_id = ""
# Confirm against xdrip2gcp when wiring this up. Often "(default)".
database_id = "(default)"
# Collection "current", document "entries". Overwritten every five minutes.
document_path = "current/entries"
# Read-only service account from phase 2. Email only; the key stays in the file below.
service_account_email = ""
# JSON key downloaded in phase 2. This path is gitignored.
service_account_key_file = "secrets/tc002-reader.json"

[wifi]
# Network the clock joins. Both values are injected at build time.
ssid = ""
password = ""

[display]
# How often the clock reads the document. The document itself moves every five minutes.
poll_interval_seconds = 60
# Appended to the glucose number, as in "128 mg/dl".
units_label = "mg/dl"
