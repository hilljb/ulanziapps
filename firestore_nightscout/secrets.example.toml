# Local configuration for the TC002 Nightscout reader.
# How to fill this in, and what the account is allowed to do: README.md
# Copy this file to secrets.toml. secrets.toml and the JSON key are gitignored.
# Paths are relative to firestore_nightscout/.

[gcp]
# GCP project that holds the xdrip2gcp Firestore database.
# Leave empty to let setup_reader.py copy `gcloud config get-value project`.
project_id = ""
# Firestore database id. xdrip2gcp uses the project's one Native database.
database_id = "(default)"
# Collection "current", document "entries". Overwritten every five minutes.
# The reader requests this path. IAM itself is scoped to the database, not this path.
document_path = "current/entries"
# Filled by setup_reader.py. Email only; the private key stays in the file below.
service_account_email = ""
# JSON key written by setup_reader.py. gitignored.
service_account_key_file = "secrets/tc002-reader.json"

[wifi]
# Unused. AWTRIX NG stores the Wi-Fi network on the clock.
# These values are not injected into a firmware image.
ssid = ""
password = ""

[display]
# How often the clock reads the document. The document itself moves every five minutes.
poll_interval_seconds = 60
# Appended to the glucose number, as in "128 mg/dl".
units_label = "mg/dl"

[clock]
# LAN address of the TC002. AWTRIX NG serves http://<ip>/ on port 80.
# Wi-Fi ADB is not used. The clock also advertises a hostname such as
# awtrixng-77a638.local; on this Mac the IP is the address that answers.
ip = ""
