# Local configuration for the TC002 Nightscout reader.
# Copy this file to secrets.toml and fill it from the sources in the comments.
# secrets.toml and the JSON key are gitignored. Commit this template only.
# The filled project id, the service-account email, the Wi-Fi name, and the
# Wi-Fi passphrase stay in secrets.toml. Do not paste them into a plan, a
# README, or a script. Committed docs say PROJECT_ID or YOUR_PROJECT_ID.
# Paths are relative to firestore_nightscout/.
# What the account is allowed to do: README.md

[gcp]
# GCP project id for the Firestore database xdrip2gcp writes.
# Read it with `gcloud config get-value project` after `gcloud config set project`,
# or from the project picker at https://console.cloud.google.com/.
# Leave this empty to let setup_reader.py copy the gcloud value into secrets.toml.
# The same id is also the JSON key's project_id field. Both copies stay gitignored.
project_id = ""
# Firestore database id inside that project.
# xdrip2gcp uses the one Native database, id (default).
# Cloud console: Firestore → Databases. Change this only if that list shows another id,
# and use the same id in the curl URL in README.md. Keep the quotes.
database_id = "(default)"
# Document xdrip2gcp overwrites, about every five minutes.
# Collection "current", document "entries". This repo does not create it.
# xdrip2gcp getting started, through "Check that it works":
# https://github.com/hilljb/xdrip2gcp/blob/main/getting-started.md
# The reader requests this path. IAM itself is scoped to the database, not this path.
document_path = "current/entries"
# Written by setup_reader.py into secrets.toml. Leave empty until that script
# has run. The form is tc002-nightscout-reader@PROJECT_ID.iam.gserviceaccount.com
# with PROJECT_ID taken from project_id above. Email only.
# The same address is the JSON key's client_email, and it is embedded in
# client_x509_cert_url. Do not copy the filled address into a committed file.
service_account_email = ""
# Where setup_reader.py writes the key, via
# `gcloud iam service-accounts keys create`.
# Google issues the JSON. Do not hand-write it.
# These fields stay inside that gitignored file:
#   project_id, private_key_id, private_key, client_email, client_id,
#   client_x509_cert_url
# The script sets mode 0600. A file already at this path is kept.
# On the Pi, copy this file from the machine that ran setup_reader.py.
# Deleting it and running the script again creates a new key
# and leaves the old key on the account.
service_account_key_file = "secrets/tc002-reader.json"

[wifi]
# Home Wi-Fi name, the same one typed into the clock at http://192.168.4.1/
# during AP mode. AWTRIX stores it on the clock. Nothing in this repo reads it.
# If you write it down, it belongs in secrets.toml only. Leave the template empty.
ssid = ""
# Home Wi-Fi passphrase, from the same AP-mode page on the clock.
# Nothing in this repo reads it. secrets.toml is the only copy. Leave this empty.
password = ""

[display]
# How often the clock asks for a new line, in seconds.
# Chosen here: the document moves about every five minutes, and a one-minute
# poll stays inside the Firestore free tier. Not a credential.
poll_interval_seconds = 60
# Suffix on the glucose number. xdrip2gcp stores sgv in mg/dL, so this is mg/dl.
# Not a credential.
units_label = "mg/dl"

[clock]
# LAN address of one TC002, for notes and for the curl examples in README.md.
# Read it off the panel after the start animation, from the Status app, or from
# the router device list. The router name looks like awtrixng-77a638, the last
# six characters of the clock's Wi-Fi MAC.
# serve_reading.py does not read this. A second clock does not need its own entry.
# AWTRIX serves http://<ip>/ on port 80.
ip = ""
